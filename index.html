<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Workout Log</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#log">Log Workout</a></li>
          <li class="nav-item"><a class="nav-link" href="#history">History</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="bg-primary text-white text-center py-5">
    <div class="container">
      <h1 class="display-4 fw-bold">Track Every Rep</h1>
      <p class="lead mb-4">Log your workouts, watch your progress, stay consistent.</p>
      <a href="#log" class="btn btn-light btn-lg">Start Logging</a>
    </div>
  </header>

  <!-- Workout Form -->
  <section id="log" class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="h4 mb-4">Add a Workout</h2>

                <div class="mb-3">
                  <label for="workoutName" class="form-label">Workout Name</label>
                  <input type="text" class="form-control" id="workoutName" name="workoutName"
                         placeholder="e.g. Bench Press">
                </div>

                <div class="row">
                  <div class="col-sm-6 mb-3">
                    <label for="reps" class="form-label">Reps</label>
                    <input type="number" class="form-control" id="reps" name="reps"
                           min="1" step="1" placeholder="e.g. 10">
                  </div>
                  <div class="col-sm-6 mb-3">
                    <label for="weight" class="form-label">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight" name="weight"
                           min="0" step="1" placeholder="e.g. 60">
                  </div>
                </div>

                <div class="mb-4">
                  <label for="intensity" class="form-label">Intensity</label>
                  <select class="form-select" id="intensity" name="intensity" required>
                    <option value="" selected disabled>Choose intensity...</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg" id="submitWorkout">Save Workout</button>
                </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- History List (static placeholder items) -->
  <section id="history" class="pb-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <h2 class="h4 mb-3">Workout History</h2>
          <ul class="list-group shadow-sm" id="list">
